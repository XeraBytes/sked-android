name: Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:

jobs:
  check-version:
    if: contains(github.ref, 'refs/tags') == false
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.version_changed }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract versionName and check tag
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1 || true)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not detect versionName in app/build.gradle.kts"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git rev-parse "v$VERSION_NAME" >/dev/null 2>&1; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$VERSION_NAME already exists; skipping release."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Decode release keystore if configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release-keystore.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::KEYSTORE_BASE64 secret not set; building unsigned release APK."
          fi

      - name: Configure optional API key
        env:
          CI_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${CI_GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY=${CI_GEMINI_API_KEY}" > .env
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_GITHUB_OWNER: ${{ vars.RELEASE_GITHUB_OWNER }}
          RELEASE_GITHUB_REPO: ${{ vars.RELEASE_GITHUB_REPO }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release asset and changelog
        id: package
        run: |
          VERSION="${{ needs.check-version.outputs.version_name }}"
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1 || true)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found"
            exit 1
          fi
          TARGET_APK="sked-v${VERSION}.apk"
          cp "$APK_PATH" "$TARGET_APK"
          echo "apk_file=$TARGET_APK" >> "$GITHUB_OUTPUT"

          PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)
          {
            echo "## Sked v${VERSION}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)"
            else
              git log -n 15 --pretty=format:"- %s (%h)"
            fi
          } > release_notes.md

      - name: Create or update GitHub Release
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TARGET_REPO: ${{ vars.RELEASE_TARGET_REPO }}
          DEFAULT_REPO: ${{ github.repository }}
        run: |
          GH_TOKEN="${RELEASE_PAT:-$GITHUB_TOKEN}"
          export GH_TOKEN
          TARGET_REPO="${CUSTOM_TARGET_REPO:-$DEFAULT_REPO}"
          TAG="v${{ needs.check-version.outputs.version_name }}"
          APK="${{ steps.package.outputs.apk_file }}"
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$TARGET_REPO" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$TARGET_REPO" \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --notes-file release_notes.md
          fi
